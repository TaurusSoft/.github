name: Bug Report
description: Report a problem with this node/package
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "e.g. 1.4.2"
    validations:
      required: true
  - type: input
    id: n8n-version
    attributes:
      label: n8n version
      placeholder: "e.g. 1.62.0"
    validations:
      required: true
  - type: dropdown
    id: n8n-hosting
    attributes:
      label: n8n hosting
      options:
        - "n8n Cloud"
        - "Self-hosted (Docker)"
        - "Self-hosted (npm)"
        - "Desktop app"
        - "Other"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error output
      render: shell
